# CodeRabbit — configuração de review (sprintx)
# Schema: https://docs.coderabbit.ai/reference/configuration
#
# Revisão automática DESLIGADA (ver auto_review, abaixo, com a data e o número que
# justificam). Neste repositório a review do CodeRabbit é sempre pedida à mão,
# comentando `@coderabbitai review` no PR.
language: 'pt-BR'
early_access: false

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false

  # Revisão automática só na ABERTURA do PR (ou quando um rascunho vira "pronto
  # para revisão"). Os commits seguintes não disparam nova revisão: comente
  # `@coderabbitai review` (só o que mudou) ou `@coderabbitai full review` (tudo).
  # PR de documentação não é revisado sozinho quando o título tem `docs:` ou `docs(`.
  # Atenção: o CodeRabbit procura o trecho em QUALQUER parte do título, não só no
  # começo (não existe filtro por prefixo). Use esses trechos só como prefixo de
  # PR de documentação. O disparo manual continua valendo em qualquer PR.
  # DESLIGADO em 2026-09-20, decisão do Flávio, por medição — não por preferência.
  # A cota do CodeRabbit é de 1 revisão por hora para a ORGANIZAÇÃO AxisGov inteira
  # (não por repositório, não por assento), e 14 repositórios disputam essa fila.
  # Painel de capacidade, últimos 7 dias: 400 eventos de revisão, 318 BLOQUEADOS
  # por limite, 67 entregues, 0 continuados. Bloqueio é revisão PERDIDA: não fica
  # na fila e não é cobrada depois. Pior ainda, com auto_incremental_review: false
  # a revisão automática caía na ABERTURA do PR, quando ele está mais vazio, e cada
  # push seguinte só consumia o limite sem revisar nada.
  # A partir daqui a revisão é PEDIDA À MÃO: comente `@coderabbitai review` no PR,
  # e só quando o PR valer a cota (fronteira, dois donos, irreversível, ou o CodeAnt
  # não olhou). Consequência: check verde do CodeRabbit passa a significar "nada foi
  # pedido", não "foi lido e nada achou".
  # Antes de religar isto, confira a mesma medição — se a cota continuar em 1/hora
  # para a organização, religar só devolve o bloqueio.
  #
  # As chaves abaixo só têm efeito com enabled: true. Ficam guardadas de propósito,
  # como registro da configuração que valia, para quem um dia religar.
  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    ignore_title_keywords:
      - 'docs:'
      - 'docs('

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  path_filters:
    - '!**/package-lock.json'
    - '!**/pnpm-lock.yaml'
    - '!**/yarn.lock'
    - '!**/node_modules/**'
    - '!**/dist/**'
